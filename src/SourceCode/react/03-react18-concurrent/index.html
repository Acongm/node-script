<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React 18 并发特性示例 - React 核心原理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .description {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .demo-section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .demo-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
      border-bottom: 2px solid #1890ff;
      padding-bottom: 10px;
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      background: #1890ff;
      color: white;
    }
    
    button:hover {
      background: #40a9ff;
    }
    
    button:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }
    
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
    }
    
    .stats {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    
    .stats-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .stats-value {
      font-weight: bold;
      color: #1890ff;
    }
    
    .list {
      background: #fafafa;
      padding: 15px;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .list-item {
      padding: 8px;
      margin-bottom: 4px;
      background: white;
      border-radius: 3px;
      font-size: 13px;
    }
    
    .list-item:nth-child(odd) {
      background: #f5f5f5;
    }
    
    .pending {
      opacity: 0.6;
      pointer-events: none;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #1890ff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 10px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .info {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      padding: 12px;
      border-radius: 4px;
      color: #096dd9;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .warning {
      background: #fff7e6;
      border: 1px solid #ffd666;
      padding: 12px;
      border-radius: 4px;
      color: #d46b08;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
    
    .render-log {
      background: #1f1f1f;
      color: #52c41a;
      padding: 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 10px;
    }
    
    .render-log-item {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>React 18 并发特性示例</h1>
    <p class="description">
      本示例演示 React 18 的三大并发特性：Automatic Batching、useTransition 和 useDeferredValue。
    </p>
    
    <div id="root"></div>
  </div>

  <script type="module">
    import React, { useState, useTransition, useDeferredValue, useEffect } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0';
    import { flushSync } from 'https://esm.sh/react-dom@18.2.0';

    // ==================== 1. Automatic Batching ====================

    function AutoBatchingDemo() {
      const [count, setCount] = useState(0);
      const [flag, setFlag] = useState(false);
      const [renderLog, setRenderLog] = useState([]);

      const logRender = (message) => {
        const log = `${new Date().toLocaleTimeString()}.${Date.now() % 1000} - ${message}`;
        setRenderLog(prev => [log, ...prev].slice(0, 10));
      };

      useEffect(() => {
        logRender('组件渲染');
      });

      // React 17 风格：不批处理
      const handleClickNoBatch = () => {
        setTimeout(() => {
          // React 18 之前，这里会触发 2 次渲染
          // React 18 自动批处理，只触发 1 次渲染
          setCount(c => c + 1);
          setFlag(f => !f);
        }, 0);
      };

      // 强制同步更新（退出批处理）
      const handleClickFlushSync = () => {
        setTimeout(() => {
          flushSync(() => {
            setCount(c => c + 1); // 立即渲染
          });
          flushSync(() => {
            setFlag(f => !f); // 再次渲染
          });
        }, 0);
      };

      // Promise 中的批处理
      const handleClickPromise = () => {
        Promise.resolve().then(() => {
          setCount(c => c + 1);
          setFlag(f => !f);
          // React 18 自动批处理
        });
      };

      return (
        <div className="demo-section">
          <h2>1. Automatic Batching（自动批处理）</h2>
          <div className="info">
            <strong>React 18 新特性：</strong>在所有场景下自动批处理状态更新，包括 setTimeout、Promise、原生事件等。
            <br/>点击按钮观察渲染日志：批处理只会产生 1 次渲染，flushSync 会产生多次渲染。
          </div>

          <div className="stats">
            <div className="stats-item">
              <span>计数器：</span>
              <span className="stats-value">{count}</span>
            </div>
            <div className="stats-item">
              <span>标志位：</span>
              <span className="stats-value">{flag ? 'true' : 'false'}</span>
            </div>
          </div>

          <div className="controls">
            <button onClick={handleClickNoBatch}>
              异步更新（自动批处理）
            </button>
            <button onClick={handleClickPromise}>
              Promise 更新（自动批处理）
            </button>
            <button onClick={handleClickFlushSync}>
              flushSync（强制同步）
            </button>
          </div>

          <div className="render-log">
            <div style={{ marginBottom: '8px', color: '#ffd666' }}>
              渲染日志（观察渲染次数）：
            </div>
            {renderLog.map((log, i) => (
              <div key={i} className="render-log-item">{log}</div>
            ))}
          </div>
        </div>
      );
    }

    // ==================== 2. useTransition ====================

    function generateItems(query) {
      const items = [];
      for (let i = 0; i < 10000; i++) {
        items.push(`${query} - 项目 ${i + 1}`);
      }
      return items;
    }

    function UseTransitionDemo() {
      const [query, setQuery] = useState('');
      const [items, setItems] = useState([]);
      const [isPending, startTransition] = useTransition();

      const handleChange = (e) => {
        const value = e.target.value;
        setQuery(value); // 紧急更新，立即响应输入

        // 标记为非紧急更新，可以被中断
        startTransition(() => {
          const newItems = generateItems(value);
          setItems(newItems);
        });
      };

      return (
        <div className="demo-section">
          <h2>2. useTransition（过渡更新）</h2>
          <div className="info">
            <strong>使用场景：</strong>区分紧急更新（用户输入）和非紧急更新（列表渲染）。
            <br/>输入文字时，输入框立即响应，大列表渲染被标记为低优先级，不会阻塞输入。
          </div>

          <div className="controls">
            <input
              type="text"
              value={query}
              onChange={handleChange}
              placeholder="输入搜索关键词..."
            />
            {isPending && <div className="spinner"></div>}
          </div>

          <div className="stats">
            <div className="stats-item">
              <span>列表项数量：</span>
              <span className="stats-value">{items.length}</span>
            </div>
            <div className="stats-item">
              <span>是否pending：</span>
              <span className="stats-value">{isPending ? 'true' : 'false'}</span>
            </div>
          </div>

          <div className={`list ${isPending ? 'pending' : ''}`}>
            {items.slice(0, 100).map((item, i) => (
              <div key={i} className="list-item">{item}</div>
            ))}
            {items.length > 100 && (
              <div className="list-item" style={{ color: '#999' }}>
                ... 还有 {items.length - 100} 项
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==================== 3. useDeferredValue ====================

    function UseDeferredValueDemo() {
      const [query, setQuery] = useState('');
      const deferredQuery = useDeferredValue(query);
      const items = generateItems(deferredQuery);

      return (
        <div className="demo-section">
          <h2>3. useDeferredValue（延迟值）</h2>
          <div className="info">
            <strong>使用场景：</strong>当你无法控制组件内部（如第三方组件），使用延迟值推迟更新。
            <br/>与 useTransition 类似，但更适合你无法修改子组件的情况。
          </div>

          <div className="controls">
            <input
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="输入搜索关键词..."
            />
          </div>

          <div className="stats">
            <div className="stats-item">
              <span>实际输入：</span>
              <span className="stats-value">{query}</span>
            </div>
            <div className="stats-item">
              <span>延迟值：</span>
              <span className="stats-value">{deferredQuery}</span>
            </div>
            <div className="stats-item">
              <span>列表项数量：</span>
              <span className="stats-value">{items.length}</span>
            </div>
            <div className="stats-item">
              <span>是否延迟中：</span>
              <span className="stats-value">{query !== deferredQuery ? 'true' : 'false'}</span>
            </div>
          </div>

          <div className={`list ${query !== deferredQuery ? 'pending' : ''}`}>
            {items.slice(0, 100).map((item, i) => (
              <div key={i} className="list-item">{item}</div>
            ))}
            {items.length > 100 && (
              <div className="list-item" style={{ color: '#999' }}>
                ... 还有 {items.length - 100} 项
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==================== 主应用 ====================

    function App() {
      return (
        <>
          <AutoBatchingDemo />
          <div className="grid-2">
            <UseTransitionDemo />
            <UseDeferredValueDemo />
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
