<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>useMemo & useCallback 示例 - React 核心原理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .description {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .demo-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .demo-section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .demo-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .demo-section.wrong h2::before {
      content: '❌ ';
    }
    
    .demo-section.correct h2::before {
      content: '✅ ';
    }
    
    .controls {
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      background: #1890ff;
      color: white;
    }
    
    button:hover {
      background: #40a9ff;
    }
    
    .stats {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    
    .stats-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .stats-item:last-child {
      margin-bottom: 0;
    }
    
    .stats-value {
      font-weight: bold;
      color: #1890ff;
    }
    
    .stats-value.high {
      color: #ff4d4f;
    }
    
    .child-component {
      background: #fafafa;
      padding: 15px;
      border-radius: 4px;
      border-left: 3px solid #52c41a;
      margin-bottom: 10px;
    }
    
    .child-component.rendered {
      animation: flash 0.5s;
    }
    
    @keyframes flash {
      0%, 100% { background: #fafafa; }
      50% { background: #fffbe6; }
    }
    
    .render-log {
      background: #1f1f1f;
      color: #52c41a;
      padding: 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 10px;
    }
    
    .render-log-item {
      margin-bottom: 4px;
    }
    
    .warning {
      background: #fff7e6;
      border: 1px solid #ffd666;
      padding: 12px;
      border-radius: 4px;
      color: #d46b08;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .info {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      padding: 12px;
      border-radius: 4px;
      color: #096dd9;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }
    
    .value-display {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #1890ff;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>useMemo & useCallback 性能优化示例</h1>
    <p class="description">
      本示例对比使用和不使用性能优化 Hooks 的差异。<br>
      操作：拖动滑块改变计数器，观察子组件的渲染次数和日志输出。
    </p>
    
    <div id="root"></div>
  </div>

  <script type="module">
    import React, { useState, useMemo, useCallback, useRef, memo } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0';

    // 模拟昂贵计算
    function expensiveCalculation(num) {
      console.log('🔥 执行昂贵计算...');
      let result = 0;
      for (let i = 0; i < 100000000; i++) {
        result += num;
      }
      return result;
    }

    // ==================== 未优化版本 ====================

    // 子组件（未使用 memo）
    function ChildWithoutMemo({ data, onClick }) {
      const renderCount = useRef(0);
      renderCount.current++;
      
      return (
        <div className="child-component rendered">
          <div>子组件数据：{data.value}</div>
          <div>渲染次数：{renderCount.current}</div>
          <button onClick={onClick}>点击我</button>
        </div>
      );
    }

    function WithoutOptimization() {
      const [count, setCount] = useState(0);
      const [logs, setLogs] = useState([]);
      
      // ❌ 每次渲染都创建新对象
      const data = { value: count };
      
      // ❌ 每次渲染都创建新函数
      const handleClick = () => {
        const log = `${new Date().toLocaleTimeString()} - 按钮被点击`;
        setLogs(prev => [log, ...prev].slice(0, 10));
      };
      
      // ❌ 每次渲染都执行昂贵计算
      const calculated = expensiveCalculation(count);
      
      return (
        <div className="demo-section wrong">
          <h2>未优化版本</h2>
          <div className="warning">
            <strong>问题：</strong><br/>
            1. 每次渲染都执行昂贵计算（即使 count 没变）<br/>
            2. 每次都创建新的 data 对象和 handleClick 函数<br/>
            3. 子组件每次都重新渲染（因为 props 引用变了）
          </div>
          
          <div className="stats">
            <div className="stats-item">
              <span>计数器：</span>
              <span className="stats-value">{count}</span>
            </div>
            <div className="stats-item">
              <span>计算结果：</span>
              <span className="stats-value">{calculated}</span>
            </div>
          </div>
          
          <input 
            type="range" 
            min="0" 
            max="10" 
            value={count} 
            onChange={(e) => setCount(Number(e.target.value))}
          />
          <div className="value-display">{count}</div>
          
          <ChildWithoutMemo data={data} onClick={handleClick} />
          
          <div className="render-log">
            {logs.map((log, i) => (
              <div key={i} className="render-log-item">{log}</div>
            ))}
          </div>
        </div>
      );
    }

    // ==================== 优化版本 ====================

    // 子组件（使用 memo）
    const ChildWithMemo = memo(({ data, onClick }) => {
      const renderCount = useRef(0);
      renderCount.current++;
      
      return (
        <div className="child-component rendered">
          <div>子组件数据：{data.value}</div>
          <div>渲染次数：{renderCount.current} ⚡</div>
          <button onClick={onClick}>点击我</button>
        </div>
      );
    });

    function WithOptimization() {
      const [count, setCount] = useState(0);
      const [logs, setLogs] = useState([]);
      
      // ✅ 使用 useMemo 缓存对象
      const data = useMemo(() => ({ value: count }), [count]);
      
      // ✅ 使用 useCallback 缓存函数
      const handleClick = useCallback(() => {
        const log = `${new Date().toLocaleTimeString()} - 按钮被点击`;
        setLogs(prev => [log, ...prev].slice(0, 10));
      }, []);
      
      // ✅ 使用 useMemo 缓存昂贵计算
      const calculated = useMemo(() => {
        return expensiveCalculation(count);
      }, [count]);
      
      return (
        <div className="demo-section correct">
          <h2>优化版本</h2>
          <div className="info">
            <strong>优化：</strong><br/>
            1. useMemo 缓存昂贵计算（只在 count 变化时执行）<br/>
            2. useMemo 缓存 data 对象（只在 count 变化时创建新对象）<br/>
            3. useCallback 缓存 handleClick 函数（始终是同一引用）<br/>
            4. 子组件使用 memo 包裹（props 不变时不重渲染）
          </div>
          
          <div className="stats">
            <div className="stats-item">
              <span>计数器：</span>
              <span className="stats-value">{count}</span>
            </div>
            <div className="stats-item">
              <span>计算结果：</span>
              <span className="stats-value">{calculated}</span>
            </div>
          </div>
          
          <input 
            type="range" 
            min="0" 
            max="10" 
            value={count} 
            onChange={(e) => setCount(Number(e.target.value))}
          />
          <div className="value-display">{count}</div>
          
          <ChildWithMemo data={data} onClick={handleClick} />
          
          <div className="render-log">
            {logs.map((log, i) => (
              <div key={i} className="render-log-item">{log}</div>
            ))}
          </div>
        </div>
      );
    }

    // ==================== 主应用 ====================

    function App() {
      return (
        <div className="demo-grid">
          <WithoutOptimization />
          <WithOptimization />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
