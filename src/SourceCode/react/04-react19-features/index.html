<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React 19 新特性示例 - React 核心原理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .description {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .demo-section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .demo-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
      border-bottom: 2px solid #722ed1;
      padding-bottom: 10px;
    }
    
    .warning-box {
      background: #fff2e8;
      border: 2px dashed #ff7a45;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin: 20px 0;
    }
    
    .warning-box h3 {
      color: #d4380d;
      margin-bottom: 10px;
    }
    
    .warning-box p {
      color: #8c8c8c;
      line-height: 1.6;
    }
    
    .code-block {
      background: #1f1f1f;
      color: #52c41a;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      overflow-x: auto;
      margin: 15px 0;
      line-height: 1.6;
    }
    
    .feature-list {
      list-style: none;
      padding: 0;
    }
    
    .feature-list li {
      padding: 12px;
      margin-bottom: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      border-left: 3px solid #722ed1;
    }
    
    .feature-list li::before {
      content: '✨ ';
      margin-right: 8px;
    }
    
    .info {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      padding: 15px;
      border-radius: 4px;
      color: #096dd9;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 20px 0;
    }
    
    @media (max-width: 768px) {
      .comparison {
        grid-template-columns: 1fr;
      }
    }
    
    .comparison-item {
      background: #fafafa;
      padding: 15px;
      border-radius: 4px;
    }
    
    .comparison-item h4 {
      margin-bottom: 10px;
      color: #333;
    }
    
    .comparison-item.old h4::before {
      content: '❌ ';
    }
    
    .comparison-item.new h4::before {
      content: '✅ ';
    }
    
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>React 19 新特性示例</h1>
    <p class="description">
      本页面展示 React 19 的主要新特性和改进（概念演示）。
      <br/>注意：部分特性需要 React 19 才能运行，当前使用 React 18 演示概念。
    </p>
    
    <div id="root"></div>
  </div>

  <script type="module">
    import React from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0';

    function App() {
      return (
        <>
          {/* React Compiler */}
          <div className="demo-section">
            <h2>1. React Compiler（自动优化）</h2>
            <div className="info">
              <strong>最大变革：</strong>编译器自动优化你的代码，不再需要手动使用 memo/useMemo/useCallback！
            </div>

            <div className="comparison">
              <div className="comparison-item old">
                <h4>React 18（手动优化）</h4>
                <pre>{`const Component = React.memo(({ data }) => {
  const processed = useMemo(
    () => processData(data),
    [data]
  );
  
  const handler = useCallback(() => {
    handleClick();
  }, []);
  
  return <Child data={processed} onClick={handler} />;
});`}</pre>
              </div>

              <div className="comparison-item new">
                <h4>React 19（编译器自动优化）</h4>
                <pre>{`function Component({ data }) {
  // 编译器自动缓存
  const processed = processData(data);
  const handler = () => handleClick();
  
  return <Child data={processed} onClick={handler} />;
}

// 编译器生成的代码会自动插入必要的缓存逻辑`}</pre>
              </div>
            </div>

            <ul className="feature-list">
              <li>编译时分析依赖关系，自动插入缓存逻辑</li>
              <li>代码更简洁，心智负担更低</li>
              <li>避免手动优化的错误（如忘记依赖项）</li>
              <li>性能比手动优化更好（编译器更智能）</li>
            </ul>
          </div>

          {/* Actions */}
          <div className="demo-section">
            <h2>2. Actions（表单处理增强）</h2>
            <div className="info">
              <strong>新增 Hooks：</strong>useActionState、useFormStatus、useOptimistic 简化异步表单处理。
            </div>

            <div className="comparison">
              <div className="comparison-item old">
                <h4>React 18（手动管理状态）</h4>
                <pre>{`function AddTodo() {
  const [pending, setPending] = useState(false);
  const [error, setError] = useState(null);
  
  const handleSubmit = async (e) => {
    e.preventDefault();
    setPending(true);
    setError(null);
    try {
      await addTodo(new FormData(e.target));
    } catch (err) {
      setError(err.message);
    } finally {
      setPending(false);
    }
  };
  
  return (
    <form onSubmit={handleSubmit}>
      <input name="title" />
      <button disabled={pending}>
        {pending ? 'Adding...' : 'Add'}
      </button>
      {error && <p>{error}</p>}
    </form>
  );
}`}</pre>
              </div>

              <div className="comparison-item new">
                <h4>React 19（使用 Actions）</h4>
                <pre>{`function AddTodo() {
  const [state, submitAction, isPending] = 
    useActionState(async (prevState, formData) => {
      try {
        await addTodo(formData);
        return { success: true };
      } catch (err) {
        return { error: err.message };
      }
    }, { success: false });
  
  return (
    <form action={submitAction}>
      <input name="title" />
      <button disabled={isPending}>
        {isPending ? 'Adding...' : 'Add'}
      </button>
      {state.error && <p>{state.error}</p>}
    </form>
  );
}`}</pre>
              </div>
            </div>

            <ul className="feature-list">
              <li>自动管理 loading 状态（isPending）</li>
              <li>自动处理表单提交</li>
              <li>支持乐观更新（useOptimistic）</li>
              <li>代码更简洁，错误处理更优雅</li>
            </ul>
          </div>

          {/* use() API */}
          <div className="demo-section">
            <h2>3. use() API（统一资源读取）</h2>
            <div className="info">
              <strong>功能：</strong>在组件中读取 Promise 或 Context，自动触发 Suspense。
            </div>

            <div className="code-block">
{`// 读取 Promise
function UserProfile({ userPromise }) {
  const user = use(userPromise); // 等待 Promise 完成
  return <div>{user.name}</div>;
}

// 条件读取 Context（React 19 新能力）
function ThemedComponent({ isDark }) {
  const theme = use(isDark ? DarkThemeContext : LightThemeContext);
  return <div style={theme}>Content</div>;
}

// 与 Suspense 配合
<Suspense fallback={<Loading />}>
  <UserProfile userPromise={fetchUser(123)} />
</Suspense>`}
            </div>

            <ul className="feature-list">
              <li>可以在条件语句中使用（突破 Hooks 限制）</li>
              <li>自动触发 Suspense</li>
              <li>统一 Promise 和 Context 的读取方式</li>
            </ul>
          </div>

          {/* ref as prop */}
          <div className="demo-section">
            <h2>4. ref 作为 prop（简化 ref 传递）</h2>
            <div className="info">
              <strong>改进：</strong>不再需要 forwardRef，ref 可以直接作为 prop 传递。
            </div>

            <div className="comparison">
              <div className="comparison-item old">
                <h4>React 18（需要 forwardRef）</h4>
                <pre>{`const Input = React.forwardRef((props, ref) => {
  return <input ref={ref} {...props} />;
});

// 使用
<Input ref={inputRef} />`}</pre>
              </div>

              <div className="comparison-item new">
                <h4>React 19（直接使用）</h4>
                <pre>{`function Input({ ref, ...props }) {
  return <input ref={ref} {...props} />;
}

// 使用
<Input ref={inputRef} />`}</pre>
              </div>
            </div>
          </div>

          {/* Document Metadata */}
          <div className="demo-section">
            <h2>5. Document Metadata（内置 SEO 支持）</h2>
            <div className="info">
              <strong>改进：</strong>组件中直接管理 title、meta 标签，不再需要 react-helmet。
            </div>

            <div className="comparison">
              <div className="comparison-item old">
                <h4>React 18（需要 react-helmet）</h4>
                <pre>{`import { Helmet } from 'react-helmet';

function BlogPost({ post }) {
  return (
    <>
      <Helmet>
        <title>{post.title}</title>
        <meta name="description" content={post.excerpt} />
      </Helmet>
      <article>{post.content}</article>
    </>
  );
}`}</pre>
              </div>

              <div className="comparison-item new">
                <h4>React 19（原生支持）</h4>
                <pre>{`function BlogPost({ post }) {
  return (
    <>
      <title>{post.title}</title>
      <meta name="description" content={post.excerpt} />
      <article>{post.content}</article>
    </>
  );
}

// React 自动提升到 <head> 中`}</pre>
              </div>
            </div>
          </div>

          {/* Resource Preloading */}
          <div className="demo-section">
            <h2>6. 资源预加载 API</h2>
            <div className="info">
              <strong>新增：</strong>preload、preinit、prefetchDNS、preconnect 等 API。
            </div>

            <div className="code-block">
{`import { preload, preinit, prefetchDNS, preconnect } from 'react-dom';

function ProductPage({ productId }) {
  useEffect(() => {
    // 预加载图片
    preload(\`/products/\${productId}/hero.jpg\`, { as: 'image' });
    
    // 预初始化脚本
    preinit('/analytics.js', { as: 'script' });
    
    // DNS 预解析
    prefetchDNS('https://api.example.com');
    
    // 预连接
    preconnect('https://cdn.example.com');
  }, [productId]);
  
  return <div>Product {productId}</div>;
}

// 自动生成 <link rel="preload"> 等标签`}
            </div>
          </div>

          {/* 其他改进 */}
          <div className="demo-section">
            <h2>7. 其他重要改进</h2>
            <ul className="feature-list">
              <li><strong>Context 性能优化：</strong>自动选择性订阅，只有使用的值变化才重渲染</li>
              <li><strong>Suspense 增强：</strong>更好的错误处理和 onError 回调</li>
              <li><strong>Server Components 稳定：</strong>React Server Components 正式稳定</li>
              <li><strong>并发渲染优化：</strong>更智能的优先级调度</li>
              <li><strong>useMemo/useCallback 改进：</strong>即使不写依赖数组也能正确工作</li>
            </ul>
          </div>

          {/* 升级建议 */}
          <div className="demo-section">
            <h2>8. 升级建议</h2>
            <div className="info">
              <strong>渐进式升级：</strong>
              <br/>1. React 18 → React 19：大部分代码无需修改
              <br/>2. 启用 React Compiler：逐步移除手动的 memo/useMemo/useCallback
              <br/>3. 使用新 API：在新功能中使用 Actions、use() 等新特性
              <br/>4. 性能测试：升级后进行充分的性能测试
            </div>

            <div className="code-block">
{`// 安装 React 19（稳定版发布后）
npm install react@19 react-dom@19

// 启用 React Compiler
npm install babel-plugin-react-compiler
// babel.config.js
module.exports = {
  plugins: [
    ['babel-plugin-react-compiler', {
      target: '18' // 向下兼容
    }]
  ]
};`}
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
