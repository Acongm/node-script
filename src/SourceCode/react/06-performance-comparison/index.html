<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>性能对比工具 - React 核心原理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .description {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 768px) {
      .demo-grid {
        grid-template-columns: 1fr;
      }
    }
    
    .demo-section {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .demo-section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
      border-bottom: 2px solid #722ed1;
      padding-bottom: 10px;
    }
    
    .demo-section.without h2::before {
      content: '❌ ';
    }
    
    .demo-section.with h2::before {
      content: '✅ ';
    }
    
    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      background: #1890ff;
      color: white;
    }
    
    button:hover {
      background: #40a9ff;
    }
    
    button.danger {
      background: #ff4d4f;
    }
    
    button.danger:hover {
      background: #ff7875;
    }
    
    .metrics {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    
    .metric-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 8px;
      background: white;
      border-radius: 3px;
    }
    
    .metric-item:last-child {
      margin-bottom: 0;
    }
    
    .metric-name {
      color: #666;
    }
    
    .metric-value {
      font-weight: bold;
      color: #1890ff;
    }
    
    .metric-value.good {
      color: #52c41a;
    }
    
    .metric-value.bad {
      color: #ff4d4f;
    }
    
    .chart {
      background: white;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    
    .bar-chart {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .bar-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .bar-label {
      width: 150px;
      font-size: 13px;
      color: #666;
    }
    
    .bar-container {
      flex: 1;
      height: 30px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1890ff, #722ed1);
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }
    
    .bar-fill.good {
      background: linear-gradient(90deg, #52c41a, #73d13d);
    }
    
    .bar-fill.bad {
      background: linear-gradient(90deg, #ff4d4f, #ff7875);
    }
    
    .list {
      max-height: 400px;
      overflow-y: auto;
      background: #fafafa;
      padding: 10px;
      border-radius: 4px;
    }
    
    .list-item {
      padding: 10px;
      margin-bottom: 5px;
      background: white;
      border-radius: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      transition: background 0.2s;
    }
    
    .list-item:hover {
      background: #e6f7ff;
    }
    
    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }
    
    .info {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      padding: 15px;
      border-radius: 4px;
      color: #096dd9;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .summary {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    .summary h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
    }
    
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    
    .comparison-table th,
    .comparison-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .comparison-table th {
      background: #fafafa;
      font-weight: 600;
      color: #333;
    }
    
    .comparison-table tr:hover {
      background: #f5f5f5;
    }
    
    .value-display {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #1890ff;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>React 性能对比工具</h1>
    <p class="description">
      对比使用和不使用性能优化的差异。拖动滑块调整列表大小，观察渲染次数、耗时等指标。
    </p>
    
    <div id="root"></div>
  </div>

  <script type="module">
    import React, { useState, useMemo, useCallback, useRef, memo, useEffect } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0';

    // ==================== 未优化版本 ====================

    function ListItemWithout({ item, onDelete }) {
      const renderCount = useRef(0);
      renderCount.current++;
      const startTime = performance.now();
      
      // 模拟一些计算
      let sum = 0;
      for (let i = 0; i < 10000; i++) {
        sum += i;
      }
      
      useEffect(() => {
        const renderTime = performance.now() - startTime;
      });
      
      return (
        <div className="list-item">
          <span>{item.text}</span>
          <span style={{ color: '#999', fontSize: '12px' }}>
            渲染 {renderCount.current} 次
          </span>
          <button className="danger" onClick={onDelete}>删除</button>
        </div>
      );
    }

    function WithoutOptimization({ listSize }) {
      const [items, setItems] = useState([]);
      const [count, setCount] = useState(0);
      const renderCount = useRef(0);
      const [metrics, setMetrics] = useState({
        totalRenders: 0,
        averageRenderTime: 0,
        lastRenderTime: 0,
      });

      renderCount.current++;

      useEffect(() => {
        const newItems = Array.from({ length: listSize }, (_, i) => ({
          id: i,
          text: `任务 ${i + 1}`,
        }));
        setItems(newItems);
      }, [listSize]);

      useEffect(() => {
        const startTime = performance.now();
        return () => {
          const renderTime = performance.now() - startTime;
          setMetrics(prev => ({
            totalRenders: renderCount.current,
            averageRenderTime: renderTime,
            lastRenderTime: renderTime,
          }));
        };
      });

      const handleDelete = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      return (
        <div className="demo-section without">
          <h2>未优化版本</h2>
          
          <div className="metrics">
            <div className="metric-item">
              <span className="metric-name">父组件渲染次数：</span>
              <span className="metric-value bad">{renderCount.current}</span>
            </div>
            <div className="metric-item">
              <span className="metric-name">列表项数量：</span>
              <span className="metric-value">{items.length}</span>
            </div>
            <div className="metric-item">
              <span className="metric-name">最后渲染耗时：</span>
              <span className="metric-value bad">{metrics.lastRenderTime.toFixed(2)}ms</span>
            </div>
            <div className="metric-item">
              <span className="metric-name">独立计数器：</span>
              <span className="metric-value">{count}</span>
            </div>
          </div>

          <div className="controls">
            <button onClick={() => setCount(count + 1)}>
              点击 +1（观察所有子组件是否重渲染）
            </button>
          </div>

          <div className="list">
            {items.map(item => (
              <ListItemWithout 
                key={item.id} 
                item={item} 
                onDelete={() => handleDelete(item.id)}
              />
            ))}
          </div>
        </div>
      );
    }

    // ==================== 优化版本 ====================

    const ListItemWith = memo(({ item, onDelete }) => {
      const renderCount = useRef(0);
      renderCount.current++;
      const startTime = performance.now();
      
      // 模拟一些计算
      let sum = 0;
      for (let i = 0; i < 10000; i++) {
        sum += i;
      }
      
      return (
        <div className="list-item">
          <span>{item.text}</span>
          <span style={{ color: '#52c41a', fontSize: '12px' }}>
            渲染 {renderCount.current} 次 ⚡
          </span>
          <button className="danger" onClick={onDelete}>删除</button>
        </div>
      );
    });

    function WithOptimization({ listSize }) {
      const [items, setItems] = useState([]);
      const [count, setCount] = useState(0);
      const renderCount = useRef(0);
      const [metrics, setMetrics] = useState({
        totalRenders: 0,
        averageRenderTime: 0,
        lastRenderTime: 0,
      });

      renderCount.current++;

      useEffect(() => {
        const newItems = Array.from({ length: listSize }, (_, i) => ({
          id: i,
          text: `任务 ${i + 1}`,
        }));
        setItems(newItems);
      }, [listSize]);

      useEffect(() => {
        const startTime = performance.now();
        return () => {
          const renderTime = performance.now() - startTime;
          setMetrics(prev => ({
            totalRenders: renderCount.current,
            averageRenderTime: renderTime,
            lastRenderTime: renderTime,
          }));
        };
      });

      const handleDelete = useCallback((id) => {
        setItems(prev => prev.filter(item => item.id !== id));
      }, []);

      return (
        <div className="demo-section with">
          <h2>优化版本（memo + useCallback）</h2>
          
          <div className="metrics">
            <div className="metric-item">
              <span className="metric-name">父组件渲染次数：</span>
              <span className="metric-value good">{renderCount.current}</span>
            </div>
            <div className="metric-item">
              <span className="metric-name">列表项数量：</span>
              <span className="metric-value">{items.length}</span>
            </div>
            <div className="metric-item">
              <span className="metric-name">最后渲染耗时：</span>
              <span className="metric-value good">{metrics.lastRenderTime.toFixed(2)}ms</span>
            </div>
            <div className="metric-item">
              <span className="metric-name">独立计数器：</span>
              <span className="metric-value">{count}</span>
            </div>
          </div>

          <div className="controls">
            <button onClick={() => setCount(count + 1)}>
              点击 +1（子组件不会重渲染）
            </button>
          </div>

          <div className="list">
            {items.map(item => (
              <ListItemWith 
                key={item.id} 
                item={item} 
                onDelete={() => handleDelete(item.id)}
              />
            ))}
          </div>
        </div>
      );
    }

    // ==================== 主应用 ====================

    function App() {
      const [listSize, setListSize] = useState(50);

      return (
        <>
          <div className="summary">
            <h2>性能测试控制面板</h2>
            <div className="info">
              <strong>测试说明：</strong><br/>
              1. 调整滑块改变列表大小<br/>
              2. 点击"+1"按钮，观察两个版本的表现差异<br/>
              3. 未优化版本：所有子组件都会重新渲染<br/>
              4. 优化版本：子组件使用 memo 包裹，父组件更新时不会重渲染
            </div>

            <div className="controls" style={{ marginTop: '15px' }}>
              <label style={{ flex: '0 0 auto', color: '#666' }}>列表大小：</label>
              <input 
                type="range" 
                min="10" 
                max="200" 
                value={listSize} 
                onChange={(e) => setListSize(Number(e.target.value))}
                style={{ flex: 1 }}
              />
              <div className="value-display" style={{ flex: '0 0 auto', margin: 0 }}>
                {listSize} 项
              </div>
            </div>
          </div>

          <div className="demo-grid">
            <WithoutOptimization listSize={listSize} />
            <WithOptimization listSize={listSize} />
          </div>

          <div className="summary">
            <h2>优化效果对比</h2>
            <table className="comparison-table">
              <thead>
                <tr>
                  <th>指标</th>
                  <th>未优化</th>
                  <th>已优化</th>
                  <th>改善</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>子组件重渲染</td>
                  <td style={{ color: '#ff4d4f' }}>❌ 所有子组件</td>
                  <td style={{ color: '#52c41a' }}>✅ 仅变化的子组件</td>
                  <td style={{ color: '#52c41a' }}>大幅减少</td>
                </tr>
                <tr>
                  <td>渲染性能</td>
                  <td style={{ color: '#ff4d4f' }}>较慢</td>
                  <td style={{ color: '#52c41a' }}>快速</td>
                  <td style={{ color: '#52c41a' }}>提升 80%+</td>
                </tr>
                <tr>
                  <td>内存占用</td>
                  <td style={{ color: '#ff4d4f' }}>较高</td>
                  <td style={{ color: '#faad14' }}>轻微增加</td>
                  <td style={{ color: '#faad14' }}>缓存成本</td>
                </tr>
                <tr>
                  <td>用户体验</td>
                  <td style={{ color: '#ff4d4f' }}>可能卡顿</td>
                  <td style={{ color: '#52c41a' }}>流畅</td>
                  <td style={{ color: '#52c41a' }}>显著提升</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div className="summary">
            <h2>优化建议</h2>
            <div className="info">
              <strong>何时优化：</strong><br/>
              ✅ 列表组件（特别是大列表）<br/>
              ✅ 渲染成本高的组件（复杂计算、大量 DOM）<br/>
              ✅ 频繁更新的父组件下的静态子组件<br/>
              ✅ 用 React DevTools Profiler 确认有性能问题<br/><br/>
              
              <strong>何时不优化：</strong><br/>
              ❌ 简单组件（一个 div + 文本）<br/>
              ❌ props 总是变化的组件<br/>
              ❌ 很少重新渲染的组件<br/>
              ❌ 过早优化（先开发功能，后优化性能）<br/><br/>
              
              <strong>React 19 改进：</strong><br/>
              🎉 React Compiler 自动优化，无需手动 memo/useMemo/useCallback！
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
