<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sub-react-app for qiankun</title>
  </head>
  <body>
    <!-- qiankun 会把这个 HTML 模板注入到主应用 container 里 -->
    <!-- ⚠️ 避免与主应用的 #root 冲突，子应用使用独立的 root id -->
    <div id="sub-root"></div>

    <!-- 关键：不要用 type="module"，用普通 script，让 qiankun 可以执行 -->
    <script src="/qiankun-entry.js"></script>
  </body>
</html>
